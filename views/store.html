<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="stylesheets/store.css" />
  <link rel="stylesheet" href="stylesheets/slide.css" />
  <%- include('header.html')%>
</head>

<body>
  <%- include('nav.html')%>

  <div class="conten">
    <div class="Explope">
      <div class="slide">
        <div class="con-card">
          
        </div>
        

        <button class="nav prev">&#10094;</button>
        <button class="nav next">&#10095;</button>

        <div class="dots"></div>
      </div>
      <div class="title">
        Explore
      </div>
      <div class="navmenu ">
        <div class="con">
          <div class="search">
            <i class="fi fi-rr-search"></i>
            <input id="filterTitle" placeholder="search" type="text">
          </div>
        </div>


      </div>

      <section class="grid-header">
        <div class="filters">
          <select id="filterPlatform">
            <option value="">All</option>
            <option value="PC">PC</option>
            <option value="PS5">PS5</option>
            <option value="Xbox">Xbox</option>
            <option value="Switch">Switch</option>
          </select>
          <input type="number" id="filterPriceMin" placeholder="฿ Min" style="width:80px;">
          <input type="number" id="filterPriceMax" placeholder="฿ Max" style="width:80px;">
          <input type="number" id="filterStockMin" placeholder="Stock Min" style="width:90px;">
          <input type="number" id="filterStockMax" placeholder="Stock Max" style="width:90px;">
        </div>

        <div class="sort-buttons">
          <label>Sort:</label>
          <button onclick="sortGames('price', 'asc')"><i class="fi fi-rr-money-bill-wave"></i> Price ⬆</button>
          <button onclick="sortGames('price', 'desc')"><i class="fi fi-rr-money-bill-wave"></i> Price ⬇</button>
          <button onclick="sortGames('stock', 'asc')"><i class="fi fi-rr-box"></i> Stock ⬆</button>
          <button onclick="sortGames('stock', 'desc')"><i class="fi fi-rr-box"></i> Stock ⬇</button>
        </div>
      </section>
      <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
      <div class="filter">
        <div class="layout" active="True" id="gitQ">
          <i class="fi fi-rr-apps"></i>
        </div>
        <div class="layout" active="False" id="gitW">
          <i class="fi fi-rr-rectangle-horizontal"></i>
        </div>
      </div>
    </div>

    <div id="ShopExplo" class="normal"></div>
  </div>
</body>

<Script src="/javascripts/store.js"></Script>
<script src="/javascripts/slide.js"></script>
<!-- <i class="fi fi-rr-box"></i> SweetAlert2 สำหรับ popup สวยๆ -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  // <i class="fi fi-rr-check-circle"></i> ฟังก์ชัน Global fetch handler
  window.fetch = (async(originalFetch => {
    return async (...args) => {
      const response = await originalFetch(...args);

      if (response.status === 403) {
        let data = {};
        try {
          data = await response.clone().json();
        } catch (e) { }

        Swal.fire({
          icon: 'error',
          title: 'Access Denied',
          text: data.message || 'คุณไม่มีสิทธิ์เข้าถึงหน้านี้',
          confirmButtonText: 'ตกลง',
          confirmButtonColor: '#3085d6',
          background: '#1e1e1e',
          color: '#fff'
        });

        return response; // ยังคงส่ง response กลับให้โค้ดอื่นทำงานต่อได้
      }

      return response;
    };
  })(window.fetch));
</script>

</html>
