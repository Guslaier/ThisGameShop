<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Game Shop - Register</title>

  <link rel="stylesheet" href="/stylesheets/style.css">
  <link rel="stylesheet" href="/stylesheets/register.css">

  <!-- Icons -->
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
</head>

<body>
  <nav>
    <div class="nav-l">
      <img src="/images/this-game-shop-high-resolution-logo.png" alt="This Game Shop Logo" />
    </div>
    <div class="nav-c">
      <ul class="group">
        <li><a href="/"><i class="fi fi-rr-home icon"></i> Home</a></li>
        <li><a href="/store"><i class="fi fi-rr-sign-hanging icon"></i> Store</a></li>
        <li><a href="/cart"><i class="fi fi-rr-shopping-cart icon"></i> Cart</a></li>
      </ul>
    </div>
    <div class="nav-r"></div>
  </nav>

  <main class="content">
    <div class="register-container">
      <h2 class="register-title">Register</h2>
      <p class="register-sub">Join the game universe 🎮</p>

      <form id="registerForm">
        <div class="wrap-input">
          <input class="input" type="text" name="display_name" placeholder="Name" required />
        </div>

        <div class="wrap-input">
          <input class="input" type="email" name="email" placeholder="Email" required />
        </div>

        <div class="wrap-input password-wrap">
          <input class="input" type="password" name="password" placeholder="Password" id="password" required />
          <i class="fi fi-rr-eye" id="togglePassword"></i>
        </div>

        <div class="wrap-input password-wrap">
          <input class="input" type="password" name="password_confirm" placeholder="Confirm Password" id="passwordConfirm" required />
          <i class="fi fi-rr-eye" id="togglePasswordConfirm"></i>
        </div>

        <button type="submit" class="register-btn">Create Account</button>

            <div class="extra-links">
            <a href="./">Already have an account? Login →</a>
            </div>
      </form>
    </div>
  </main>

  <script src="/javascripts/register.js"></script>
</body>
</html>
