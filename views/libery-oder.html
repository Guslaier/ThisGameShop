<!DOCTYPE html>
<html lang="th">

<head>
  <%- include('header.html') %>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Library & Orders</title>
    <link rel="stylesheet" href="/stylesheets/libery-oder.css" />

</head>

<body>
  <%- include('nav.html') %>

    <div class="conten">
      <h1>My Library & Orders</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="library"><i class="fi fi-rr-gamepad"></i> Library</button>
        <button class="tab-btn" data-tab="orders"><i class="fi fi-rr-receipt"></i> Orders</button>
      </div>

      <!-- ========== LIBRARY ========== -->
      <section id="library" class="section active">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>ชื่อเกม</th>
              <th>แพลตฟอร์ม</th>
              <th>CD-Key</th>
              <th>วันที่ได้รับ</th>
            </tr>
          </thead>
          <tbody id="libTbody">
            <tr>
              <td colspan="5" class="empty">กำลังโหลด...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- ========== ORDERS ========== -->
      <section id="orders" class="section">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>เลขออเดอร์</th>
              <th>ยอดรวม</th>
              <th>สถานะ</th>
              <th>วันที่สั่ง</th>
              <th>การทำงาน</th>
            </tr>
          </thead>
          <tbody id="ordersTbody">
            <tr>
              <td colspan="6" class="empty">กำลังโหลด...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>

</body>
<script src="/javascripts/libery-oder.js"></script>
</html>
