<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThisGameShop Reports</title>

  <!-- ===== STYLES ===== -->
  <link rel="stylesheet" href="/stylesheets/admin/style.css">
  <link rel="stylesheet" href="/stylesheets/admin/report.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">

  <!-- ===== LIBRARIES ===== -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
<button id="toggleSidebar">☰ Menu</button>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar">
  <div>
    <h2>THISGAMESHOP</h2>
    <div class="menu">
      <a href="/ad-m">Dashboard</a>
      <a href="/ad-m/User">Users</a>
      <a href="/ad-m/Games">Games</a>
      <a href="/ad-m/Orders">Orders</a>
      <a class="active">Reports</a>
    </div>
  </div>
  <footer>© 2025 ThisGameShop</footer>
</aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main-con">
  <div class="header">
    <h1>Admin Reports</h1>
    <input type="text" placeholder="🔍 ค้นหาข้อมูล...">
  </div>

  <!-- ===== KPI CARDS ===== -->
  <div class="cards">
    <div class="card"><h3 id="totalOrders">0 Orders</h3><h3 id="totalAmount">฿ 0</h3><p>Total Purchases</p></div>
  </div>

  <div class="filter-bar">
  <label for="filterMonth">📅 Month:</label>
  <select id="filterMonth">
    <option value="">All</option>
    <option value="1">January</option>
    <option value="2">February</option>
    <option value="3">March</option>
    <option value="4">April</option>
    <option value="5">May</option>
    <option value="6">June</option>
    <option value="7">July</option>
    <option value="8">August</option>
    <option value="9">September</option>
    <option value="10">October</option>
    <option value="11">November</option>
    <option value="12">December</option>
  </select>

  <label for="filterYear">🗓️ Year:</label>
  <select id="filterYear">
    <option value="">All</option>
    <!-- ✅ JS will auto-fill available years -->
  </select>

  <button class="btn" id="btnFilter">Filter</button>
  <button class="btn" id="btnClear">Clear</button>
</div>  

  <!-- ===== GAME TABLE ===== -->
  <section class="section">
    <h2>🎮 Game Stock</h2>
    <div class="table-container">
      <table id="orderTable">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Customer Name</th>
            <th>Cost (฿)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="total-summary">
    <div class="total-label">💰 Total Revenue</div>
    <div class="total-amount" id="totalRevenueDisplay">฿ 0.00</div>
  </div>
  </section>

  <!-- ===== EXPORT ===== -->
  <section class="section" style="text-align:center;">
    <button class="btn" onclick="exportCSV()">📄 Export CSV</button>
  </section>

</main>

<script src="/javascripts/admin/report.js"></script>
</body>
</html>
