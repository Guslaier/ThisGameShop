<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThisGameShop Admin - Users</title>
  <link rel="stylesheet" href="/stylesheets/admin/style.css" />
  <link rel="stylesheet" href="/stylesheets/admin/user.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <!-- Sidebar -->
  <button id="toggleSidebar">☰ Menu</button>
  <aside class="sidebar">
    <div>
      <h2>THISGAMESHOP</h2>
      <div class="menu">
        <a href="/ad-m">Dashboard</a>
        <a class="active">Users</a>
        <a href="/ad-m/Games">Games</a>
        <a href="/ad-m/Orders">Orders</a>
        <a href="/ad-m/Reports">Reports</a>
      </div>
    </div>
    <footer>© 2025 ThisGameShop</footer>
  </aside>

  <!-- Main -->
  <main class="main-con">
    <header class="topbar">
      <h1>👥 User Management</h1>
      <button id="btnAddUser" class="btn-primary">+ Add User</button>
    </header>

    <!-- ✅ ฟิลเตอร์ -->
    <section class="grid-header">
      <div class="filters">
        <input type="text" id="filterName" placeholder="Search by name or email...">
        <select id="filterRole">
          <option value="">All Roles</option>
          <option value="admin">Admin</option>
          <option value="user">User</option>
          <option value="staff">Staff</option>
        </select>
        <select id="filterStatus">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    <!-- ✅ ตารางผู้ใช้ -->
    
    <div id="userTableBody" class="user-grid"></div>

  </main>

  <!-- ✅ Script -->
  <script src="/javascripts/admin/admin.js"></script>
  <script src="/javascripts/admin/user.js"></script>
</body>
</html>
