<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/stylesheets/admin/style.css" />
  <link rel="stylesheet" href="/stylesheets/admin/ad-game.css" />
  <title>ThisGameShop Admin - Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@400;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Sidebar -->
  <button id="toggleSidebar"><i class="fi fi-rr-menu-burger"></i> Menu</button>
  <aside class="sidebar">
    <div>
      <h2>THISGAMESHOP</h2>
      <div class="menu">
        <a href="/ad-m">Dashboard</a>
        <a href="/ad-m/User">Users</a>
        <a class="active">Games</a>
        <a href="/ad-m/Orders">Orders</a>
        <a href="/ad-m/Reports">Reports</a>
      </div>
    </div>
    <footer>© 2025 ThisGameShop</footer>
  </aside>

  <!-- Main -->
  <main class="main-con">
    <header class="topbar">
      <h1><i class="fi fi-rr-gamepad"></i> Games Management</h1>
      <button id="btnAddGame" class="btn-primary">+ Add Game</button>
    </header>

    <!-- <i class="fi fi-rr-check-circle"></i> ส่วน Gallery -->
    <section id="gallerySection" class="gallery hidden">
      <h2 id="galleryHeader"><i class="fi fi-rr-camera"></i> Game Gallery</h2>
      <div id="galleryGrid" class="gallery-grid"></div>
      <form id="galleryForm" enctype="multipart/form-data" class="gallery-form">
        <input type="file" id="galleryImage" name="image" accept="image/*" required />
        <input type="text" id="galleryTitle" name="title" placeholder="Title (optional)" />
        <button type="submit" class="btn-primary">+ Add to Gallery</button>
        <button type="button" id="btnCloseGallery" class="btn-secondary">Close</button>
      </form>
    </section>

    <!-- <i class="fi fi-rr-check-circle"></i> ฟิลเตอร์ + Sort -->
    <section class="grid-header">
      <div class="filters">
        <input type="text" id="filterTitle" placeholder="Search title...">
        <select id="filterPlatform">
          <option value="">All</option>
          <option value="PC">PC</option>
          <option value="PS5">PS5</option>
          <option value="Xbox">Xbox</option>
          <option value="Switch">Switch</option>
        </select>
        <input type="number" id="filterPriceMin" placeholder="฿ Min" style="width:80px;">
        <input type="number" id="filterPriceMax" placeholder="฿ Max" style="width:80px;">
        <input type="number" id="filterStockMin" placeholder="Stock Min" style="width:90px;">
        <input type="number" id="filterStockMax" placeholder="Stock Max" style="width:90px;">
      </div>

      <div class="sort-buttons">
        <label>Sort:</label>
        <button onclick="sortGames('price', 'asc')"><i class="fi fi-rr-money-bill-wave"></i> Price ⬆</button>
        <button onclick="sortGames('price', 'desc')"><i class="fi fi-rr-money-bill-wave"></i> Price ⬇</button>
        <button onclick="sortGames('stock', 'asc')"><i class="fi fi-rr-box"></i> Stock ⬆</button>
        <button onclick="sortGames('stock', 'desc')"><i class="fi fi-rr-box"></i> Stock ⬇</button>
      </div>
    </section>

    <!-- <i class="fi fi-rr-check-circle"></i> แสดงผลแบบ Grid -->
    <section class="grid-section">
      <div id="gameGrid" class="game-grid"></div>
    </section>

    <!-- Modal: Add/Edit Game -->
    <div id="modalGame" class="modal hidden">
      <div class="modal-content">
        <h2 id="modalTitle">Add New Game</h2>
        <form id="gameForm" enctype="multipart/form-data">
          <input type="hidden" name="id" id="gameId" />
          <label>Title</label>
          <input type="text" name="title" id="title" required />
          <label>Platform</label>
          <select name="platform_flags" id="platform_flags" required>
            <option value="PC">PC</option>
            <option value="PS5">PS5</option>
            <option value="Xbox">Xbox</option>
            <option value="Switch">Nintendo Switch</option>
          </select>
          <label>Price (฿)</label>
          <input type="number" name="price" id="price" min="0" required />
          <label>Stock</label>
          <input type="number" name="stock" id="stock" min="0" required />
          <label>Release Date</label>
          <input type="date" name="release_date" id="release_date" />
          <label>Cover Image</label>
          <input type="file" name="image" id="image" />
          <label>Description</label>
          <textarea name="description_md" id="description_md" rows="4"></textarea>
          <div class="modal-buttons">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Confirm Delete -->
    <div id="confirmDelete" class="modal hidden">
      <div class="modal-content">
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete this game?</p>
        <div class="modal-buttons">
          <button id="btnYesDelete" class="btn-danger">Delete</button>
          <button id="btnCancelDelete" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
  </main>

  
</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/javascripts/admin/game.js"></script>
<script src="/javascripts/admin/admin.js"></script>
</html>
