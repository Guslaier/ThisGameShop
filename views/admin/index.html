<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/stylesheets/admin/style.css">
  <title>ThisGameShop Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<button id="toggleSidebar">☰ Menu</button>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <h2>THISGAMESHOP</h2>
      <div class="menu">
        <a class="active" >Dashboard</a>
        <a href="/ad-m/user">Users</a>
        <a href="/ad-m/Games" >Games</a>
        <a href="/ad-m/Orders" >Orders</a>
        <a href="/ad-m/Reports" >Reports</a>
      </div>
    </div>
    <footer>© 2025 ThisGameShop</footer>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="header">
      <h1>Admin Dashboard</h1>
      <input type="text" placeholder="🔍 ค้นหาข้อมูล...">
    </div>

    <!-- Cards -->
    <div class="cards">
      <div class="card">
        <h3 id="usersCount">1600</h3>
        <p>Users Active</p>
      </div>
      <div class="card">
        <h3 id="ordersCount">2300</h3>
        <p>Total Purchases</p>
      </div>
      <div class="card">
        <h3 id="reviewsCount">80%</h3>
        <p>Positive Reviews</p>
      </div>
      <div class="card">
        <h3 id="stockCount">120</h3>
        <p>Games In Stock</p>
      </div>
    </div>

    <!-- Games Table -->
    <div class="section">
      <h2>🎮Games in Stock</h2>
      <table id="gameTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Platform</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  </script>
</body>
<!-- 📦 SweetAlert2 สำหรับ popup สวยๆ -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
// ✅ ฟังก์ชัน Global fetch handler
window.fetch = (async (originalFetch => {
  return async (...args) => {
    const response = await originalFetch(...args);

    if (response.status === 403) {
      let data = {};
      try {
        data = await response.clone().json();
      } catch (e) {}

      Swal.fire({
        icon: 'error',
        title: 'Access Denied',
        text: data.message || 'คุณไม่มีสิทธิ์เข้าถึงหน้านี้',
        confirmButtonText: 'ตกลง',
        confirmButtonColor: '#3085d6',
        background: '#1e1e1e',
        color: '#fff'
      });

      return response; // ยังคงส่ง response กลับให้โค้ดอื่นทำงานต่อได้
    }

    return response;
  };
})(window.fetch));
</script>
<script src="/javascripts/admin.js"></script>
</html>
