<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/stylesheets/admin/style.css">
  <title>ThisGameShop Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <h2>THISGAMESHOP</h2>
      <div class="menu">
        <a class="active" >Dashboard</a>
        <a href="/ad-m/user">Users</a>
        <a href="/ad-m/Games" >Games</a>
        <a href="/ad-m/Orders" >Orders</a>
        <a href="/ad-m/Reports" >Reports</a>
      </div>
    </div>
    <footer>© 2025 ThisGameShop</footer>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="header">
      <h1>Admin Dashboard</h1>
      <input type="text" placeholder="🔍 ค้นหาข้อมูล...">
    </div>

    <!-- Cards -->
    <div class="cards">
      <div class="card">
        <h3 id="usersCount">1600</h3>
        <p>Users Active</p>
      </div>
      <div class="card">
        <h3 id="ordersCount">2300</h3>
        <p>Total Purchases</p>
      </div>
      <div class="card">
        <h3 id="reviewsCount">80%</h3>
        <p>Positive Reviews</p>
      </div>
      <div class="card">
        <h3 id="stockCount">120</h3>
        <p>Games In Stock</p>
      </div>
    </div>

    <!-- Games Table -->
    <div class="section">
      <h2>🎮Games in Stock</h2>
      <table id="gameTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Platform</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  </script>
</body>
</html>
