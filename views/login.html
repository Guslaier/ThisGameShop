<!DOCTYPE html>
<html lang="en">

<head>
  <%- include('header.html')%>
  <link rel="stylesheet" href="../stylesheets/login.css" />
</head>

<body>
  <%- include('nav.html')%>

  <main class="content">
    <div class="login-container">
      <h2 class="login-title">Login</h2>
      <p class="login-sub">Welcome back, gamer 🎮</p>

      <form id="loginForm">
        <div class="wrap-input">
          <input class="input" type="text" name="email" placeholder="Email" required />
        </div>

        <div class="wrap-input password-wrap">
          <input class="input" type="password" name="password" placeholder="Password" id="password" minlength="8"
            required />
          <i class="fi fi-rr-eye" id="togglePassword"></i>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="extra-links">
          <a href="#">Forgot Password?</a>
          <a href="./register">Create your Account →</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/javascripts/login.js"></script>
</body>
<!-- 📦 SweetAlert2 สำหรับ popup สวยๆ -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
// ✅ ฟังก์ชัน Global fetch handler
window.fetch = (async (originalFetch => {
  return async (...args) => {
    const response = await originalFetch(...args);

    if (response.status === 403) {
      let data = {};
      try {
        data = await response.clone().json();
      } catch (e) {}

      Swal.fire({
        icon: 'error',
        title: 'Access Denied',
        text: data.message || 'คุณไม่มีสิทธิ์เข้าถึงหน้านี้',
        confirmButtonText: 'ตกลง',
        confirmButtonColor: '#3085d6',
        background: '#1e1e1e',
        color: '#fff'
      });

      return response; // ยังคงส่ง response กลับให้โค้ดอื่นทำงานต่อได้
    }

    return response;
  };
})(window.fetch));
</script>
</html>
