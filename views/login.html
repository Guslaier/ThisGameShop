<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Game Shop - Login</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/stylesheets/style.css">
  <link rel="stylesheet" href="/stylesheets/login.css">

  <!-- Icons -->
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>

</head>

<body>
  <nav>
    <div class="nav-l">
      <img src="/images/this-game-shop-high-resolution-logo.png" alt="This Game Shop Logo" />
    </div>
    <div class="nav-c">
      <ul class="group">
        <li><a href="/"><i class="fi fi-rr-home icon"></i> Home</a></li>
        <li><a href="/store"><i class="fi fi-rr-sign-hanging icon"></i> Store</a></li>
        <li><a href="/cart"><i class="fi fi-rr-shopping-cart icon"></i> Cart</a></li>
      </ul>
    </div>
    <div class="nav-r"></div>
  </nav>

  <div class="content">
    <div class="login-container">
      <h2 class="login-title">Login</h2>
      <p class="login-sub">Welcome back, gamer 🎮</p>

      <form id="loginForm">
        <div class="wrap-input">
          <input class="input" type="text" name="email" placeholder="Email" required />
        </div>

        <div class="wrap-input password-wrap">
          <input class="input" type="password" name="password" placeholder="Password" id="password" required />
          <i class="fi fi-rr-eye" id="togglePassword"></i>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="extra-links">
          <a href="#">Forgot Password?</a>
          <a href="./register">Create your Account →</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/javascripts/login.js"></script>
</body>
</html>
