<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>this-game-shop</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/login.css">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
</head>

<body>
    <nav>
        <div class="nav-l">
            <img src="/images/this-game-shop-high-resolution-logo.png" alt="">
        </div>
        <div class="nav-c">
            <ul class="group">
                <li class="Home">

                    <a href=".">
                        <i class="fi fi-rr-home icon"></i>
                        Home
                    </a>
                </li>
                <li class="Store">

                    <a href=".">
                        <i class="fi fi-rr-sign-hanging icon"></i>
                        Store
                    </a>
                </li>
                <li class="Cart">

                    <a href=".">
                        <i class="fi fi-rr-shopping-cart icon"></i>
                        Cart
                    </a>
                </li>
            </ul>
        </div>
        <div class="nav-r">
        </div>

    </nav>
    <div class="conten">

        <div class="login-container">
            <div class="login-pic">
                <!-- <img src="/images/this-game-shop-high-resolution-logo.png" alt="IMG"> -->
            </div>

            <form id="loginForm">
                <span class="login-title">Login</span>

                <div class="wrap-input100">
                    <input class="input100" type="text" name="email" placeholder="Email" required>
                </div>

                <div class="wrap-input100">
                    <input class="input100" type="password" name="password" placeholder="Password" required>
                </div>

                <div class="container-login100-form-btn">
                    <button type="submit" class="login100-form-btn">
                        Login
                    </button>
                </div>

                <div class="text-center p-t-12">
                    <span class="txt1">Forgot</span>
                    <a class="txt2" href="#">Password?</a>
                </div>

                <div class="text-center p-t-136">
                    <a class="txt2" href="/register">
                        Create your Account
                        <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
                    </a>
                </div>
            </form>

            <script>
                document.getElementById("loginForm").addEventListener("submit", async function (event) {
                    event.preventDefault(); // กันไม่ให้ form รีเฟรชหน้า

                    const formData = new FormData(this); // เก็บค่าจาก input
                    const data = Object.fromEntries(formData.entries()); // แปลงเป็น object

                    try {
                        const response = await fetch("/account/login", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(data) // ส่งเป็น JSON
                        });
                        const result = await response.json();
                        console.log(result);
                        if (result.status == true) {
                            alert("Login Success 🎉");
                            // ตัวอย่าง redirect หลัง login
                            window.location.href = "/";
                        } else {
                            alert("Login Failed ❌ : " + result.message);
                        }
                    } catch (error) {
                        console.error("Error:", error);
                        alert("Server Error ❗");
                    }
                });
            </script>
        </div>

    </div>
</body>


</html>
