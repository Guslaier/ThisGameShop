<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/stylesheets/register.css" />
  <%- include('header.html') %>
</head>
<body>
  <%- include('nav.html') %>

  <main class="content">
    <div class="register-container">
      <h2 class="register-title">Forgot Password</h2>
      <p class="register-sub">We’ll send a 6-digit code to your email</p>

      <form id="forgotForm">
        <!-- Email -->
        <div class="wrap-input email-wrap">
          <input class="input" type="email" name="email" id="email" placeholder="Email" required />
          <button type="button" id="sendOtpBtn" class="otp-btn">Send OTP</button>
        </div>

        <!-- OTP -->
        <div class="wrap-input otp-wrap" style="display:none;">
          <input class="input" type="text" name="otp" id="otp" placeholder="Enter OTP" maxlength="6" autocomplete="one-time-code" />
          <button type="button" id="verifyOtpBtn" class="otp-btn verify">Verify</button>
        </div>

        <!-- New Password -->
        <div class="wrap-input password-wrap">
          <input class="input" type="password" name="password" id="password" placeholder="New Password" minlength="8" required autocomplete="new-password" />
          <i class="fi fi-rr-eye" id="togglePassword"></i>
        </div>

        <!-- Confirm Password -->
        <div class="wrap-input password-wrap">
          <input class="input" type="password" name="password_confirm" id="passwordConfirm" placeholder="Confirm New Password" required autocomplete="new-password" />
          <i class="fi fi-rr-eye" id="togglePasswordConfirm"></i>
        </div>

        <!-- Submit -->
        <button type="submit" class="register-btn" id="resetBtn">Reset Password</button>

        <div class="extra-links">
          <a href="/account/login">Back to login →</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/javascripts/forgot.js"></script>
</body>
</html>
