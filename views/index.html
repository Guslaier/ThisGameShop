<!DOCTYPE html>
<html lang="en">

<head>
  <%- include('header.html')%>
  <link rel="stylesheet" href="stylesheets/home.css" />
  <link rel="stylesheet" href="stylesheets/slide.css" />
</head>

<body>
  <%- include('nav.html')%>

  <div class="conten">
    <div class="Explope">
      <div class="slide">
        <div class="con-card"></div>

        <button class="nav prev">&#10094;</button>
        <button class="nav next">&#10095;</button>

        <div class="dots"></div>
      </div>
    </div>
    <section class="recommend-section">
      <h1><i class="fi fi-rr-apps"></i> Platform</h1>

      <div class="recommend-grid">
        <!-- 💻 PC -->
        <a class="recommend-card" href="/store?platform=PC">
          <img
            src="https://res.cloudinary.com/teepublic/image/private/s--vKFslUJc--/t_Preview/b_rgb:000000,c_lpad,f_jpg,h_630,q_90,w_1200/v1505406105/production/designs/1895459_1.jpg"
            alt="PC" />

            <h2>PC</h2>
          </div>
        </a>

        <!-- 🎮 PlayStation -->
        <a class="recommend-card" href="/store?platform=PS5">
          <img src="https://logovent.com/blog/wp-content/uploads/2024/06/PlayStation-Logo.png" alt="Playstation" />
          <div class="info">
            <h2>Playstation</h2>
          </div>
        </a>

        <!-- 🕹️ Nintendo -->
        <a class="recommend-card" href="/store?platform=Switch">
          <img src="https://www.cinepremiere.com.mx/wp-content/uploads/2020/08/nintendo-switch-gif.gif"
            alt="Nintendo" />
          <div class="info">
            <h2>Nintendo</h2>
          </div>
        </a>

        <!-- 🧩 Xbox -->
        <a class="recommend-card" href="/store?platform=Xbox">
          <img src="https://www.destructoid.com/wp-content/uploads/2023/09/xbox-logo.jpg?w=1200" alt="Xbox" />
          <div class="info">
            <h2>Xbox</h2>
          </div>
        </a>
      </div>
    </section>



    <script src="javascripts/slide.js"></script>

<script src="javascripts/main.js"></script>
