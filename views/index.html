<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>this-game-shop</title>
  <link rel="stylesheet" href="/stylesheets/home.css">
  <link rel="stylesheet" href="/stylesheets/style.css">
  <link rel='stylesheet'
    href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
</head>

<body>
  <nav>
    <div class="nav-l">
      <img src="/images/this-game-shop-high-resolution-logo.png" alt="">
    </div>
    <div class="nav-c">
      <ul class="group">
        <li class="Home active">

          <a>
            <i class="fi fi-rr-home icon"></i>
            Home
          </a>
        </li>
        <li class="Store">

          <a href="/store">
            <i class="fi fi-rr-sign-hanging icon"></i>
            Store
          </a>
        </li>
        <li class="Cart">

          <a href="/cart">
            <i class="fi fi-rr-shopping-cart icon"></i>
            Cart
          </a>
        </li>
      </ul>
    </div>
    <div class="nav-r" id="account-area">
      <script>
        (async () => {
          try {
            const response = await fetch("../account/session", {
              method: "POST",
              headers: { "Content-Type": "application/json" }
            });
            const data = await response.json();
            const container = document.getElementById("account-area");

            if (data.loggedIn) {
              container.innerHTML = `
        <div class="profile">
          <ul id="menu" style="padding: 0;">
            <li class="" ><a>Account</a></li>
            <li><a href="/history">History</a></li>
            <li><a href="/account/logout">Log out</a></li>
          </ul>
          <div id="pf">
            <div id="nameProfile">
              ${data.user.display_name}
            </div>
            <div id="iconProfileProfile"></div>
          </div>
        </div>
      `;
              var show = 0
              document.getElementById('pf').addEventListener("click", (e) => {
                if (show == 0) {
                  show = 1
                  document.getElementById('menu').style.display = "block"
                } else {
                  show = 0
                  document.getElementById('menu').style.display = "none"
                }
              });
            } else {
              container.innerHTML = `
        <div>
          <a href="/account/">Sign in</a>
        </div>
      `;
            }
          } catch (error) {
            console.error("Error fetching session data:", error);
          }
        })();
      </script>
    </div>

  </nav>
  <div class="conten">

  </div>
</body>


</html>
